<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TikTok Video Downloader - Fast & Free</title>
    <!-- Google Fonts for Premium UI -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: rgba(22, 29, 45, 0.7);
            --accent-pink: #ff0050;
            --accent-cyan: #00f2fe;
            --text-main: #ffffff;
            --text-sub: #94a3b8;
            --border-color: rgba(255, 255, 255, 0.08);
            --radius: 16px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
            position: relative;
        }

        /* Ambient Glow Background Effects */
        .glow-1 {
            position: absolute;
            top: -10%;
            left: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(255, 0, 80, 0.15) 0%, transparent 70%);
            z-index: -1;
            filter: blur(50px);
        }

        .glow-2 {
            position: absolute;
            bottom: -10%;
            right: -10%;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.15) 0%, transparent 70%);
            z-index: -1;
            filter: blur(50px);
        }

        /* Main Container */
        .container {
            width: 90%;
            max-width: 650px;
            margin: 40px auto;
            padding: 30px;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        /* Header UI */
        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 0%, #cbd5e1 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header h1 span {
            background: linear-gradient(135deg, var(--accent-pink), var(--accent-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            color: var(--text-sub);
            font-size: 0.95rem;
            margin-bottom: 30px;
        }

        /* Input Box */
        .input-group {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(10, 15, 26, 0.6);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 6px;
            transition: var(--transition);
        }

        .input-group:focus-within {
            border-color: rgba(0, 242, 254, 0.5);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.15);
        }

        .input-group i {
            margin-left: 15px;
            color: var(--text-sub);
            font-size: 1.1rem;
        }

        .input-group input {
            width: 100%;
            padding: 14px 12px;
            background: transparent;
            border: none;
            outline: none;
            color: #fff;
            font-size: 0.95rem;
        }

        .input-group input::placeholder {
            color: #475569;
        }

        .btn-submit {
            background: linear-gradient(135deg, var(--accent-pink), #e00047);
            color: white;
            border: none;
            padding: 14px 24px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95rem;
            cursor: pointer;
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 8px;
            white-space: nowrap;
        }

        .btn-submit:hover {
            opacity: 0.9;
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(255, 0, 80, 0.3);
        }

        /* Premium Smooth Loading Animation */
        .loader-container {
            display: none;
            margin: 30px 0;
            flex-direction: column;
            align-items: center;
            gap: 12px;
        }

        .loader-ring {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            position: relative;
            animation: rotate 1s linear infinite;
        }

        .loader-ring::before,
        .loader-ring::after {
            content: "";
            box-sizing: border-box;
            position: absolute;
            inset: 0px;
            border-radius: 50%;
            border: 3px solid transparent;
        }

        .loader-ring::before {
            border-color: var(--accent-pink) transparent;
        }

        .loader-ring::after {
            border-color: transparent var(--accent-cyan);
            animation: rotate 0.5s linear infinite reverse;
        }

        @keyframes rotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loader-text {
            color: var(--text-sub);
            font-size: 0.85rem;
            letter-spacing: 0.5px;
        }

        /* Result Section */
        .result-card {
            display: none;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid var(--border-color);
            text-align: left;
            animation: fadeIn 0.4s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .author-info {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 15px;
        }

        .author-info img {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid var(--accent-cyan);
        }

        .author-details h4 {
            font-size: 1rem;
            color: var(--text-main);
        }

        .author-details p {
            font-size: 0.8rem;
            color: var(--text-sub);
        }

        /* Caption Container & Copy Button */
        .caption-box {
            background: rgba(10, 15, 26, 0.4);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 15px;
            margin-bottom: 20px;
            position: relative;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .caption-text {
            font-size: 0.88rem;
            color: #cbd5e1;
            line-height: 1.4;
            max-height: 60px;
            overflow-y: auto;
            flex-grow: 1;
        }

        .btn-copy {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid var(--border-color);
            color: var(--text-main);
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            transition: var(--transition);
            white-space: nowrap;
        }

        .btn-copy:hover {
            background: rgba(255, 255, 255, 0.15);
            color: var(--accent-cyan);
        }

        /* Direct Download Buttons */
        .download-actions {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-download {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            text-decoration: none;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.9rem;
            transition: var(--transition);
        }

        .btn-hd {
            background: linear-gradient(135deg, var(--accent-cyan), #00b4d8);
            color: #0b0f19;
        }

        .btn-hd:hover {
            box-shadow: 0 6px 18px rgba(0, 242, 254, 0.3);
            transform: translateY(-1px);
        }

        .btn-watermark {
            background: rgba(255, 255, 255, 0.05);
            color: var(--text-sub);
            border: 1px solid var(--border-color);
        }

        .btn-watermark:hover {
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-main);
        }

        /* Error Alert */
        .error-msg {
            display: none;
            color: #ff4d4d;
            font-size: 0.85rem;
            margin-top: 12px;
        }
    </style>
</head>
<body>

    <div class="glow-1"></div>
    <div class="glow-2"></div>

    <div class="container">
        <!-- Header -->
        <div class="header">
            <h1>TikTok <span>Downloader</span></h1>
            <p>Download TikTok videos without watermark instantly</p>
        </div>

        <!-- Input Box -->
        <div class="input-group">
            <i class="fa-solid fa-link"></i>
            <input type="text" id="videoUrl" placeholder="Paste TikTok video link here..." autocomplete="off">
            <button class="btn-submit" id="fetchBtn" onclick="processVideo()">
                <span>Download</span>
                <i class="fa-solid fa-arrow-right"></i>
            </button>
        </div>
        <div class="error-msg" id="errorMsg">Please enter a valid TikTok video URL.</div>

        <!-- Smooth Premium Loader -->
        <div class="loader-container" id="loader">
            <div class="loader-ring"></div>
            <div class="loader-text">Fetching video metadata...</div>
        </div>

        <!-- Result Card -->
        <div class="result-card" id="resultCard">
            <!-- Author Info -->
            <div class="author-info">
                <img id="authorAvatar" src="" alt="Avatar">
                <div class="author-details">
                    <h4 id="authorName">Author Name</h4>
                    <p id="authorHandle">@username</p>
                </div>
            </div>

            <!-- Caption & Copy Button -->
            <div class="caption-box">
                <div class="caption-text" id="videoCaption">Video caption goes here...</div>
                <button class="btn-copy" onclick="copyCaption()">
                    <i class="fa-regular fa-copy" id="copyIcon"></i> <span id="copyText">Copy</span>
                </button>
            </div>

            <!-- Download Buttons -->
            <div class="download-actions">
                <a id="dlNoWatermark" href="#" target="_blank" class="btn-download btn-hd">
                    <i class="fa-solid fa-download"></i> Download No Watermark (HD)
                </a>
                <a id="dlWatermark" href="#" target="_blank" class="btn-download btn-watermark">
                    <i class="fa-solid fa-film"></i> Download With Watermark
                </a>
            </div>
        </div>
    </div>

    <script>
        async function processVideo() {
            const urlInput = document.getElementById('videoUrl').value.trim();
            const errorMsg = document.getElementById('errorMsg');
            const loader = document.getElementById('loader');
            const resultCard = document.getElementById('resultCard');

            // Reset UI
            errorMsg.style.display = 'none';
            resultCard.style.display = 'none';

            // Validate Link
            if (!urlInput || (!urlInput.includes('tiktok.com') && !urlInput.includes('vt.tiktok.com'))) {
                errorMsg.style.display = 'block';
                return;
            }

            // Show Loader
            loader.style.display = 'flex';

            try {
                // Free Public TikTok API (TikWM Public Endpoint)
                const response = await fetch(`https://www.tikwm.com/api/?url=${encodeURIComponent(urlInput)}`);
                const result = await response.json();

                if (result.code === 0 && result.data) {
                    const data = result.data;

                    // Populate Data
                    document.getElementById('authorAvatar').src = data.author.avatar;
                    document.getElementById('authorName').innerText = data.author.nickname || "TikTok Creator";
                    document.getElementById('authorHandle').innerText = `@${data.author.unique_id || "user"}`;
                    document.getElementById('videoCaption').innerText = data.title || "No caption available.";

                    // Set Direct Download Links
                    document.getElementById('dlNoWatermark').href = data.play;
                    document.getElementById('dlWatermark').href = data.wmplay || data.play;

                    // Force Direct Download Trigger (Optional browser behavior)
                    document.getElementById('dlNoWatermark').setAttribute('download', `tiktok_${data.id}.mp4`);
                    document.getElementById('dlWatermark').setAttribute('download', `tiktok_wm_${data.id}.mp4`);

                    // Display Result
                    loader.style.display = 'none';
                    resultCard.style.display = 'block';
                } else {
                    throw new Error("Unable to fetch video");
                }
            } catch (error) {
                loader.style.display = 'none';
                errorMsg.innerText = 'Failed to fetch video. Please check the URL and try again.';
                errorMsg.style.display = 'block';
            }
        }

        // Copy Caption Functionality
        function copyCaption() {
            const captionText = document.getElementById('videoCaption').innerText;
            navigator.clipboard.writeText(captionText).then(() => {
                const copyText = document.getElementById('copyText');
                const copyIcon = document.getElementById('copyIcon');

                copyText.innerText = 'Copied!';
                copyIcon.className = 'fa-solid fa-check';

                setTimeout(() => {
                    copyText.innerText = 'Copy';
                    copyIcon.className = 'fa-regular fa-copy';
                }, 2000);
            });
        }
    </script>
</body>
</html>
